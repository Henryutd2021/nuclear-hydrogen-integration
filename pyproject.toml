[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nuclear-h2"
version = "1.1.0"
description = "Hourly operation and sizing of nuclear plants integrated with electrolysis, hydrogen storage and batteries in energy and ancillary-service markets, linked to a lifecycle techno-economic analysis (framework of Li et al., Nature Communications 17, 7090, 2026)"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Honglin Li"}]
requires-python = ">=3.10"
# Lower bounds = oldest versions the test suite was run with (and passed); newest tested: see environment.yml
dependencies = ["numpy>=1.26", "pandas>=2.2", "xarray>=2024.6", "linopy>=0.4.4", "highspy>=1.7.2"]
keywords = ["nuclear power", "hydrogen", "high-temperature electrolysis", "ancillary services", "techno-economic analysis", "mixed-integer programming"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
gurobi = ["gurobipy"]
test = ["pytest"]

[project.scripts]
nuclear-h2 = "nuclear_h2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
